<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>California Dream</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="California Dream – punk rock cover band.">

    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="California Dream">
    <meta property="og:description" content="punk rock cover band.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://californiadream.hu">
    <meta property="og:image" content="https://californiadream.hu/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: radial-gradient(circle at top, #1a1f3a, #0b0e1a);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 720px;
            padding: 48px 32px;
            animation: fadeUp 1.2s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 8px;
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .tagline {
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 36px;
        }

        .intro {
            font-size: 1.1rem;
            line-height: 1.7;
            opacity: 0.9;
            margin-bottom: 42px;
        }

        .section {
            margin-bottom: 42px;
        }

        .section h2 {
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 12px;
        }

        .section p {
            font-size: 1rem;
            opacity: 0.75;
        }

        .social a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #4da3ff;
            text-decoration: none;
            font-size: 1rem;
            border-bottom: 1px solid transparent;
        }

        .social a:hover {
            border-bottom: 1px solid #4da3ff;
        }

        .social svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        footer {
            margin-top: 48px;
            font-size: 0.8rem;
            opacity: 0.45;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>California Dream</h1>
        <div class="tagline">punk rock cover band</div>

        <div class="intro">
            The California Dream is a punk cover band,
            from the 90's pop punk music.
            Enjoy it!
        </div>

        <div class="section">
            <h2>Events</h2>
            <p>Soon.</p>
        </div>

        <div class="section social">
            <a href="https://www.facebook.com/profile.php?id=61583996007581"
               target="_blank"
               rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M22 12a10 10 0 1 0-11.5 9.9v-7H8v-3h2.5V9.5c0-2.5 1.5-3.9 3.8-3.9
                             1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.7-1.6 1.5V12H16l-.5 3h-2.9v7
                             A10 10 0 0 0 22 12z"/>
                </svg>
                Follow us on Facebook!
            </a>
        </div>

        <footer>
            © 2026 California Dream
        </footer>
    </div>
</body>
</html>
